# A workflow for building the documentation with VitePress and deploying it on
# GitHub Pages.
#
name: Build and Deploy Documentation

on:
  # Triggers the workflow on push events for the documentation branches.
  push:
    branches:
      - master
      # - v3.x

  # Allows you to run this workflow manually from the Actions tab.
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Allows only one concurrent deployment, skipping runs queued between the run
# in-progress and latest queued. However, do NOT cancel in-progress runs as we
# want to allow these production deployments to complete.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Job for build the documentation with VitePress.
  build:
    runs-on: ubuntu-latest
    steps:
      # Checks-out the source code.
      - name: Checkout Source Code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0 # Not needed if lastUpdated is not enabled

      # Setup Node.js JavaScript runtime.
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      # Setup Github Pages.
      - name: Setup Github Pages
        uses: actions/configure-pages@v6

      # Build the documentation for every configured branch, placing each one
      # in its own subfolder so all versions are deployed side by side.
      - name: Build Documentation for All Configured Branches
        run: |
          set -euo pipefail

          # Config: each branch is published into its own subfolder ("" is the
          # site root). The VitePress "base" is already set per branch in its
          # own docs/.vitepress/config.js, so it is not overridden here.
          CONFIG='[
            {"branch": "master", "folder": ""},
            {"branch": "v3.x", "folder": "v3"}
          ]'

          # Keep the output outside the working tree, so switching branches
          # cannot wipe or interfere with the already built versions.
          OUTPUT_DIR="$RUNNER_TEMP/docs-output"
          mkdir -p "$OUTPUT_DIR"

          # Build. A process substitution is used instead of a pipe so the loop
          # runs in the current shell and a failure aborts the whole step.
          while read -r item; do
            BRANCH=$(echo "$item" | jq -r '.branch')
            FOLDER=$(echo "$item" | jq -r '.folder')

            echo "Switching to branch: $BRANCH"
            git fetch --depth=1 origin "$BRANCH"
            git checkout -f "FETCH_HEAD"

            echo "Building branch: $BRANCH into folder: ${FOLDER:-<root>}"

            # Dependencies are branch specific, so reinstall them per branch.
            npm ci
            npm run docs:build

            # Copy the generated site into its target subfolder.
            mkdir -p "$OUTPUT_DIR/$FOLDER"
            cp -r docs/.vitepress/dist/. "$OUTPUT_DIR/$FOLDER/"
          done < <(echo "$CONFIG" | jq -c '.[]')

          # Expose the output path to the upload step.
          echo "DOCS_OUTPUT_DIR=$OUTPUT_DIR" >> "$GITHUB_ENV"

      # Package and upload the website documentation as an artifact (named
      # github-pages by default) to be used on the deployment job. An artifact
      # allows you to persist data after a job has completed, and share that
      # data with another job in the same workflow.
      - name: Upload Docs Artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ env.DOCS_OUTPUT_DIR }}

  # Job for deploy the documentation to Github Pages.
  deploy:
    runs-on: ubuntu-latest

    # This job requires the build job to be executed first.
    needs: build

    # Deploy to the github-pages environment.
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      # Deploy documentation (github-pages artifact by default) to Github Pages.
      - name: Deploy Docs Artifact to Github Pages
        id: deployment
        uses: actions/deploy-pages@v5
